<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vignesh | Ecommerce Specialist</title>
  <link rel="stylesheet" href="static/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">Vignesh Subramanian</a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="work.html">My Work</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <main class="hero">
    <div class="hero-content">
      <span class="hero-badge">Ecommerce Specialist</span>
      <h1>Driving growth through data & strategy</h1>
      <p class="hero-subtitle">I help brands optimize their online presence, boost conversions, and scale revenue.</p>
    </div>

    <section class="carousel-section">
      <h2 class="section-title">Selected Works</h2>
      <div class="carousel-wrapper">
        <button class="carousel-btn carousel-btn--prev" aria-label="Previous slide">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <div class="carousel">
          <div class="carousel-track">
            <!-- Carousel slides loaded from data/works.json -->
          </div>
          <div class="carousel-dots"></div>
        </div>
        <button class="carousel-btn carousel-btn--next" aria-label="Next slide">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>
      <a href="work.html" class="cta-link">View all my work →</a>
      <div class="brands-section">
        <p class="brands-label">Brands I've worked with</p>
        <div class="brands-logos" id="brands-logos">
          <!-- Loaded from data/brands.json (run scripts/generate-brands.js when adding logos) -->
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2025 Vicky. Ecommerce Specialist.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
